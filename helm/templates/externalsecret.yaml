{{- if .Values.externalSecrets.enabled }}
{{- if .Values.vault.enabled }}
{{- fail "externalSecrets.enabled and vault.enabled are mutually exclusive: the deployment reads env either from the Vault agent file or from the Secret, not both" }}
{{- end }}
# Env vars for the API, synced from Bitwarden Secrets Manager by External Secrets
# Operator. Produces .Values.secretName, which the deployment loads via envFrom
# when vault.enabled=false. Replaces the Vault agent sidecar.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  labels:
    {{- include "safescribe-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  data:
    {{- range $envVar, $bitwardenKey := .Values.externalSecrets.data }}
    - secretKey: {{ $envVar }}
      remoteRef:
        key: {{ $bitwardenKey }}
    {{- end }}
{{- end }}
