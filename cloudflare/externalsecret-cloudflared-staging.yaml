# Staging Cloudflare Tunnel token, synced from Bitwarden (homelab project) by ESO.
# Replaces the hand-applied `cloudflared-token` Secret. Like cloudflared-staging.yaml,
# this is applied by hand (not an ArgoCD app):
#   kubectl --context home apply -f cloudflare/externalsecret-cloudflared-staging.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: safescribe-staging
spec:
  refreshInterval: 24h  # Bitwarden throttles logins; force a refresh with: kubectl annotate es <name> force-sync=$(date +%s) --overwrite
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-homelab
  target:
    name: cloudflared-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: SAFESCRIBE_STAGING_CLOUDFLARED_TUNNEL_TOKEN
