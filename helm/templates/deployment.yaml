apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "safescribe-api.fullname" . }}
  labels:
    {{- include "safescribe-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds | default 120 }}
  selector:
    matchLabels:
      {{- include "safescribe-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "safescribe-api.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-status: update
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-env: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-env: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}`}}
          export DATABASE_URL={{`{{ .Data.data.database_url }}`}}
          export REDIS_URL={{`{{ .Data.data.redis_url }}`}}
          export JWT_SECRET_KEY={{`{{ .Data.data.jwt_secret_key }}`}}
          export STRIPE_SECRET_KEY={{`{{ .Data.data.stripe_secret_key }}`}}
          export STRIPE_WEBHOOK_SECRET={{`{{ .Data.data.stripe_webhook_secret }}`}}
          export STRIPE_PRICE_ID={{`{{ .Data.data.stripe_price_id }}`}}
          {{`{{- end -}}`}}
        vault.hashicorp.com/agent-inject-file-env: env
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "safescribe-api.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.vault.enabled }}
          command: ["/bin/sh", "-c"]
          args: [". /vault/secrets/env && alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers {{ .Values.uvicorn.workers }}"]
          {{- else }}
          command: ["/bin/sh", "-c"]
          args: ["alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers {{ .Values.uvicorn.workers }}"]
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "safescribe-api.fullname" . }}-config
            {{- if not .Values.vault.enabled }}
            - secretRef:
                name: {{ .Values.secretName }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
